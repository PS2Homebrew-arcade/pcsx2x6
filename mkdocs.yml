site_name: PCSX2x6 - SYSTEM246 Emulator
site_url: https://PS2Homebrew-arcade.github.io/PCSX2x6/
theme:
  favicon: img/AppIconLarge.png
  custom_dir: overrides
  extra_css:
    - stylesheets/extra.css
  features:
    - announce.dismiss
    - navigation.footer
    - navigation.instant.preview
    - content.tooltips
  plugins:
    - glightbox
    - search
    - awesome-pages
  name: material
  palette:
    # Dark Mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Dark mode
      primary: deep orange
      accent: red

    # Light Mode
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Light mode
      primary: deep orange
      accent: red

markdown_extensions:
  - footnotes
  - pymdownx.critic
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
  - icon: simple/github
    link: https://github.com/PS2Homebrew-arcade/PCSX2x6
  - icon: simple/paypal
    link: https://www.paypal.com/paypalme/ElisraPS2
  - icon: simple/discord
    link: https://discord.gg/ghpjzNX7pH
